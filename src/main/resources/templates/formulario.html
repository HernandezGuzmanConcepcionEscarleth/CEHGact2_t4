<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>
    <h1>Nuevo empleado</h1>
    <h2 th:text="${proyecto}"></h2>

    <form th:action="@{/guardar}" th:object="${empleadoForm}" method="post">
        <p>Nombre: <input type="text" th:field="*{nombre}"></p>
        <p>Apellido: <input type="text" th:field="*{apellido}"></p>
        <p>Dirección: <input type="text" th:field="*{direccion}"></p>
        <p>Puesto: <input type="text" th:field="*{puesto}"></p>
        <p>Edad: <input type="number" th:field="*{edad}"></p>
        <p>Teléfono: <input type="text" th:field="*{telefono}"></p>
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
